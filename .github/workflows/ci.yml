name: CI
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project apps/api --extra dev
      - run: apps/api/.venv/bin/ruff check apps/api ingestion evals scripts
      - run: apps/api/.venv/bin/pytest -q apps/api/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
