[project]
name = "resolveai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
